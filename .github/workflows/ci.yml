name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Secret ficticio solo para que el build no falle; no se usa en runtime.
          JWT_SECRET: ci-build-secret-no-produccion

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
        continue-on-error: true
